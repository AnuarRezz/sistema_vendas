<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Vendas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js"></script>
    
    <script>
        // ###############################################################
        // COLE SUAS CREDENCIAIS DO FIREBASE AQUI
        // ###############################################################
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        // Inicializa o Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.getAuth(app);
    </script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm">
        <div class="text-center mb-6">
            <i class="fas fa-store text-blue-600 text-5xl"></i>
            <h1 class="text-2xl font-bold text-gray-800 mt-3">Sistema de Vendas</h1>
        </div>
        
        <form id="loginForm">
            <div class="mb-4">
                <label for="email" class="block mb-1 font-medium text-gray-700">Email</label>
                <input type="email" id="email" class="w-full p-3 border rounded-lg" required placeholder="admin@admin.com">
            </div>
            <div class="mb-6">
                <label for="password" class="block mb-1 font-medium text-gray-700">Senha</label>
                <input type="password" id="password" class="w-full p-3 border rounded-lg" required placeholder="******">
            </div>
            
            <div id="error-message" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 hidden"></div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors">
                Entrar
            </button>
        </form>
    </div>

    <script>
        // Importa as funções de autenticação
        const { signInWithEmailAndPassword, onAuthStateChanged } = firebase.auth;

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('error-message');

        // Verifica se o usuário já está logado
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Se já estiver logado, vai para o app
                window.location.href = 'index.html';
            }
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            errorMessage.classList.add('hidden');

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Login bem-sucedido, redireciona
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    // Trata erros de login
                    errorMessage.innerText = 'Usuário ou senha inválidos.';
                    if (error.code === 'auth/invalid-email') {
                        errorMessage.innerText = 'Formato de email inválido.';
                    } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                         errorMessage.innerText = 'Usuário ou senha inválidos.';
                    }
                    errorMessage.classList.remove('hidden');
                });
        });
    </script>
</body>
</html>
